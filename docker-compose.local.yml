services:
  db:
    image: postgres:16-alpine
    container_name: houseforce-dev-db
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: password
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    container_name: houseforce-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-create-bucket:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb myminio/uploads || true;
      /usr/bin/mc anonymous set public myminio/uploads;
      exit 0;
      "

  backend:
    container_name: houseforce-dev-backend
    command: npm run develop
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: password
      DATABASE_SSL: "false"
      APP_KEYS: "changeMe1,changeMe2"
      API_TOKEN_SALT: "changeMe"
      ADMIN_JWT_SECRET: "changeMe"
      TRANSFER_TOKEN_SALT: "changeMe"
      JWT_SECRET: "changeMe"
      NODE_ENV: development
      DO_SPACE_ACCESS_KEY: minioadmin
      DO_SPACE_SECRET_KEY: minioadminpassword
      DO_SPACE_ENDPOINT: http://minio:9000
      DO_SPACE_BUCKET: uploads
      DO_SPACE_REGION: us-east-1
      SEED_TEST_DATA: ${SEED_TEST_DATA:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-staff@houseforce.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-AdminPassword123!}
      SEED_CLIENT_EMAIL: ${SEED_CLIENT_EMAIL:-client@example.com}
      SEED_CLIENT_PASSWORD: ${SEED_CLIENT_PASSWORD:-password123}
    volumes:
      - ./backend:/opt/app
      - /opt/app/node_modules
      - /opt/app/build
      - /opt/app/.tmp
    depends_on:
      - db
      - minio

  frontend:
    build:
      context: ./frontend
      target: deps
    container_name: houseforce-dev-frontend
    command: npm run dev
    environment:
      STRAPI_INTERNAL_URL: http://backend:1337
      NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  portal:
    build:
      context: ./portal
      target: deps
    container_name: houseforce-dev-portal
    command: npm run dev
    env_file:
      - path: ./portal/.env.local
        required: false
    environment:
      STRAPI_INTERNAL_URL: http://backend:1337
      NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-development-secret-key-12345}
      NEXT_PUBLIC_ENABLE_DEV_LOGIN: "true"
    volumes:
      - ./portal:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3001"

volumes:
  db-data:
  minio-data:
