services:
  backend:
    build:
      context: ./backend
    container_name: houseforce-backend
    restart: unless-stopped
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: ${DATABASE_HOST:-}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      APP_KEYS: ${APP_KEYS:-}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-}
      JWT_SECRET: ${JWT_SECRET:-}
      DO_SPACE_ACCESS_KEY: ${DO_SPACE_ACCESS_KEY:-}
      DO_SPACE_SECRET_KEY: ${DO_SPACE_SECRET_KEY:-}
      DO_SPACE_ENDPOINT: ${DO_SPACE_ENDPOINT:-}
      DO_SPACE_BUCKET: ${DO_SPACE_BUCKET:-}
      DO_SPACE_REGION: ${DO_SPACE_REGION:-us-east-1}
      NODE_ENV: production
    ports:
      - "1337:1337"

  frontend:
    build:
      context: ./frontend
    container_name: houseforce-frontend
    restart: unless-stopped
    environment:
      STRAPI_INTERNAL_URL: ${STRAPI_INTERNAL_URL:-http://backend:1337}
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-http://localhost:1337}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  portal:
    build:
      context: ./portal
    container_name: houseforce-portal
    restart: unless-stopped
    environment:
      STRAPI_INTERNAL_URL: ${STRAPI_INTERNAL_URL:-http://backend:1337}
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-http://localhost:1337}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "3001:3001"
    depends_on:
      - backend
